name: CD Pipeline

on:
  workflow_run:
    workflows: [Docker Image CI]
    types:
    - completed

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Pull Docker Image
      run: sudo docker pull itsramiz/simpleapp:latest
    - name: Delete Old Docker Container
      run: sudo docker rm -f simpleapp || true
    - name: Run Docker Container
      run: sudo docker run -d -p 5000:5000 --name simpleapp itsramiz/simpleapp
